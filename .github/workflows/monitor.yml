# Gira gratis su GitHub Actions (repo pubblico) ogni 6 ore.
# Aggiorna data/radar.sqlite e docs/data/*.json; GitHub Pages ripubblica docs/ da solo.
# Segreti (Settings > Secrets > Actions): RADAR_TELEGRAM_TOKEN, RADAR_TELEGRAM_CHAT_ID
name: radar-monitor
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: radar run-once
        env:
          RADAR_TELEGRAM_TOKEN: ${{ secrets.RADAR_TELEGRAM_TOKEN }}
          RADAR_TELEGRAM_CHAT_ID: ${{ secrets.RADAR_TELEGRAM_CHAT_ID }}
      - name: Commit dati
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -f data/radar.sqlite docs/data
          git commit -m "radar: dati $(date -u +%F_%H%M)" || echo "nessuna modifica"
          git push
