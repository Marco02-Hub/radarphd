# Pagine da monitorare.
# type: listing -> pagina con elenco di annunci (cerca link nuovi)
#       info    -> pagina informativa (avvisa se il testo cambia)
# verified: false -> URL scritto a mano, DA VERIFICARE prima dell'uso.
# selector (opzionale) -> selettore CSS che delimita la zona utile della pagina.

# Parole chiave ampie: il monitor raccoglie largo, l'app filtra per le parole scelte dall'utente.
# Usate anche per decidere cosa mandare su Telegram.
keywords:
  - CFD
  - aeroelastic
  - fluid
  - flow control
  - instability
  - resolvent
  - turbulence
  - propulsion
  - turbomachinery
  - aerodynamic
  - aerospace
  - combustion
  - mechanical engineering
  - aerospace engineering
  - structural
  - energy
  - robotics
  - acoustics
  - heat transfer

phd_markers: ["phd", "ph.d", "doctoral", "doctorate", "dphil", "studentship"]

# Verifica 2026-10-18 (UA "RadarPhD", robots.txt rispettato). Bloccati da anti-bot (403/Cloudflare),
# NON aggirati: ox.ac.uk, postgraduate.study.cam.ac.uk, jobs.cam.ac.uk, eng.cam.ac.uk/.../phd-studentships,
# seas.harvard.edu, gsas.harvard.edu, galcit.caltech.edu, gradoffice.caltech.edu, mae.princeton.edu,
# gradschool.princeton.edu, findaphd.com. robots.txt vieta: mce.caltech.edu, careers.epfl.ch/services/rss.
sources:
  - uni: ETH
    name: Portale lavoro ETH (tutte le posizioni, incl. dottorato)
