# Pagine da monitorare.
# type: listing -> pagina con elenco di annunci (cerca link nuovi)
#       info    -> pagina informativa (avvisa se il testo cambia)
# verified: false -> URL scritto a mano, DA VERIFICARE prima dell'uso.
# selector (opzionale) -> selettore CSS che delimita la zona utile della pagina.

# Parole chiave ampie: il monitor raccoglie largo, l'app filtra per le parole scelte dall'utente.
# Usate anche per decidere cosa mandare su Telegram.
keywords:
  - CFD
  - aeroelastic
  - fluid
  - flow control
  - instability
  - resolvent
  - turbulence
  - propulsion
  - turbomachinery
  - aerodynamic
  - aerospace
  - combustion
  - mechanical engineering
  - aerospace engineering
  - structural
  - energy
  - robotics
  - acoustics
  - heat transfer

phd_markers: ["phd", "ph.d", "doctoral", "doctorate", "dphil", "studentship"]

