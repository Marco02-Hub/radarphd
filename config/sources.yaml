# Pagine da monitorare.
# type: listing -> pagina con elenco di annunci (cerca link nuovi)
#       info    -> pagina informativa (avvisa se il testo cambia)
# verified: false -> URL scritto a mano, DA VERIFICARE prima dell'uso.
# selector (opzionale) -> selettore CSS che delimita la zona utile della pagina.

# Parole chiave ampie, divise per gruppo: il monitor raccoglie largo, l'app filtra per le parole scelte dall'utente.
# Una posizione entra nel radar se contiene almeno una parola di qualsiasi gruppo.
# Se contiene una parola "fluidi" E una "ml" riceve l'etichetta "ML + fluidi".
# Parole di 3 lettere o meno (es. "AI", "CFD") contano solo come parola intera: "ai" non scatta dentro "main".
keywords:
  fluidi:
    - CFD
    - fluid
    - flow control
    - turbulen          # turbulence, turbulent
    - aerodynamic
    - aeroelastic
    - aeroacoustic
    - instability
    - resolvent
    - combustion
    - heat transfer
    - multiphase
    - hydrodynamic
    - navier-stokes
  ml:
    - machine learning
    - deep learning
    - neural network
    - neural operator
    - artificial intelligence
    - AI
    - data-driven
    - physics-informed
    - PINN
    - reduced-order
    - surrogate model
    - reinforcement learning
    - scientific machine learning
  altro:
    - mechanical engineering
    - aerospace engineering
    - aerospace
    - propulsion
    - turbomachinery
    - structural
    - energy
    - robotics
    - acoustics

# Profilo usato dall'IA (Gemini) per dare il voto di pertinenza a ogni posizione. Modificalo liberamente.
profilo: >
  Laureato in ingegneria meccanica/aerospaziale che cerca un PhD. Interesse principale: fluidodinamica
  (turbolenza, CFD, instabilità, controllo del flusso, aerodinamica) e soprattutto machine learning / IA
  applicati alla fluidodinamica (modelli data-driven, physics-informed, reduced-order, surrogati, RL per
  il controllo del flusso). Interessano anche ML/IA applicati ad altri ambiti dell'ingegneria meccanica e
  aerospaziale. Poco interessanti: posizioni senza componente ingegneristica o fuori da meccanica/aerospaziale.

phd_markers: ["phd", "ph.d", "doctoral", "doctorate", "dphil", "studentship"]

