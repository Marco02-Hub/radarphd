  - id: Cambridge
    photo: img/campus/cambridge.jpg
    photo_credit: null
    name: University of Cambridge
    city: Cambridge
    departments: [Engineering]
    model: uk_admission
    rolling: true
    summary: >-
      Domanda online sul portale Postgraduate Admissions per il PhD in Engineering, indicando almeno un
      potenziale supervisore. Le domande sono valutate in modo continuativo durante l'anno, ma le scadenze
      per il finanziamento (Cambridge Trusts) sono molto anticipate.
    summary_source: https://www.eng.cam.ac.uk/postgraduates/applying-postgraduate-study/applying-research-courses
    steps:
      - Individua nei gruppi di ricerca un docente adatto come supervisore (leggi i suoi articoli recenti)
      - Contattalo prima di candidarti per discutere le idee di ricerca (consigliato, non obbligatorio)
      - Domanda online sul portale Postgraduate Admissions, indicando almeno un supervisore o un gruppo
      - La domanda completa (con 2 referenze) viene valutata dal supervisore; possibile colloquio
      - Approvazione della divisione, poi Degree Committee e Postgraduate Admissions Office; offerta via email
    steps_source: https://www.eng.cam.ac.uk/postgraduates/applying-postgraduate-study/applying-research-courses
    prepare:
      - Contatti di 2 referenti accademici
      - Transcript di tutti i titoli universitari
      - CV
      - Reasons for applying (2500 caratteri)
      - Research proposal (facoltativa)
      - Certificazione di inglese, se richiesta
    deadlines:
      - label: Finanziamento Cambridge Trusts (anno 2026/27)
        date: "2025-12-02"
        recurring: null
        source: https://www.eng.cam.ac.uk/postgraduates/applying-postgraduate-study/applying-research-courses
      - label: Domanda per inizio ottobre 2026
        date: "2026-05-14"
        recurring: null
        source: https://www.eng.cam.ac.uk/postgraduates/applying-postgraduate-study/applying-research-courses
      - label: Domanda per inizio gennaio 2027
        date: "2026-07-30"
        recurring: null
        source: https://www.eng.cam.ac.uk/postgraduates/applying-postgraduate-study/applying-research-courses
    contacts:
      - role: Engineering Graduate Studies Office (ammissioni)
        name: null
        email: pg-admissions@eng.cam.ac.uk
        url: https://www.eng.cam.ac.uk/postgraduates/applying-postgraduate-study/applying-research-courses
        source: https://www.eng.cam.ac.uk/postgraduates/applying-postgraduate-study/applying-research-courses
    verified: true

  - id: Imperial
    photo: img/campus/imperial.jpg
    photo_credit: null
    name: Imperial College London
    city: Londra
    departments: [Aeronautics, Mechanical Engineering]
    model: uk_admission
    rolling: true
    summary: >-
      Domande di PhD tutto l'anno, ma conviene candidarsi circa un anno prima dell'inizio (ottobre).
      Prima della domanda bisogna accordarsi con un supervisore: in Mechanical Engineering le domande senza
      il supporto di un supervisore indicato non vengono processate.
    summary_source: https://www.imperial.ac.uk/aeronautics/study/phd/application-process/
    steps:
      - Verifica i requisiti d'ingresso (di norma laurea 2:1 o 1st o equivalente, più requisiti di inglese)
      - Individua temi e supervisori nelle pagine del personale del dipartimento
      - Contatta il supervisore per discutere il progetto e ottenerne il supporto
      - Domanda sul sistema online di Imperial indicando tema, supervisore ed eventuale finanziamento richiesto
      - Colloquio con il supervisore; decisione di solito entro 8–10 settimane (tracciabile su e-Service)
    steps_source: https://www.imperial.ac.uk/aeronautics/study/phd/application-process/
    prepare:
      - CV di massimo 2 pagine (con pubblicazioni, se presenti)
      - Research proposal / personal statement di massimo 2 pagine (non serve per una studentship già pubblicata)
      - Contatti di 2 referenti accademici (non da email personali)
    deadlines:
      - label: Borse — primo round per domande inviate entro inizio novembre
        date: null
        recurring: null
        source: https://www.imperial.ac.uk/aeronautics/study/phd/application-process/
      - label: Borse — consigliato candidarsi entro la scadenza di gennaio
        date: null
        recurring: null
        source: https://www.imperial.ac.uk/aeronautics/study/phd/application-process/
    contacts:
