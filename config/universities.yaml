# Come funziona la candidatura per ateneo.
# model: direct | doctoral_school | uk_admission | us_department
# photo/photo_credit: foto campus per l'header della scheda ateneo; credit obbligatorio.
# TUTTI i testi sono da verificare sui siti ufficiali (verified: false).

universities:
  - id: ETH
    photo: img/campus/eth.jpg   # foto fissa da Wikimedia Commons (licenza libera)
    photo_credit: null
    name: ETH Zürich
    city: Zurigo
    departments: [D-MAVT]
    model: direct
    rolling: true
    steps:
      - Trova la posizione sul portale lavoro ETH o sulla pagina del gruppo
      - Candidati al professore tramite l'annuncio (o email diretta)
      - Colloqui
      - Dopo l'offerta, iscrizione al dottorato presso l'amministrazione dottorale
    contacts: []          # da compilare: {role, name, email, url}
    verified: false

  - id: EPFL
    photo: img/campus/epfl.jpg   # foto fissa da Wikimedia Commons (licenza libera)
    photo_credit: null
    name: EPFL
    city: Losanna
    departments: [EDME]
    model: doctoral_school
    rolling: false
    deadlines: []          # date ufficiali della scuola dottorale, da compilare
    steps:
      - Contatta un potenziale supervisore
      - Domanda online alla scuola dottorale (CV, trascrizioni, motivazione)
      - Lettere di referenza
      - Colloquio con laboratorio e/o commissione
    contacts: []
    verified: false

  - id: Oxford
    photo: img/campus/oxford.jpg   # foto fissa da Wikimedia Commons (licenza libera)
    photo_credit: null
    name: University of Oxford
    departments: [Engineering Science]
    model: uk_admission
    steps:
      - Domanda di ammissione al DPhil entro la scadenza del corso
      - Indicare il supervisore/gruppo di interesse
      - Finanziamento tramite studentship o borse (spesso stessa scadenza)
    contacts: []
    verified: false

