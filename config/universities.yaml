  - id: MIT
    photo: img/campus/mit.jpg
    photo_credit: null
    name: MIT
    city: Cambridge (MA)
    departments: [AeroAstro, MechE]
    model: us_department
    rolling: false
    summary: >-
      Si fa domanda al singolo dipartimento, un ciclo all'anno (apertura a settembre, ingresso in autunno,
      niente ammissione primaverile). In AeroAstro chi ha solo la laurea triennale entra nel Master e accede
      al PhD superando il Qualifying Process.
    summary_source: https://aeroastro.mit.edu/education/graduate-admission/
    steps:
      - Domanda online sul portale del dipartimento (AeroAstro o MechE); niente allegati via email
      - Statement of Objectives, transcript di ogni ateneo frequentato, 3 lettere di referenza online
      - Test di inglese se non madrelingua (MechE — IELTS 7.0, TOEFL 100 iBT o DET 135); GRE non richiesto
      - Valutazione da parte del comitato di ammissione del dipartimento
    steps_source: https://meche.mit.edu/education/prospective-students/graduate/apply
    prepare:
      - Statement of Objectives
      - Transcript (ufficiali o non ufficiali; ufficiali richiesti dopo l'ammissione)
      - 3 lettere di referenza, preferibilmente da docenti con cui hai fatto ricerca
      - IELTS / TOEFL / DET se richiesto
    deadlines:
