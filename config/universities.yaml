# Come funziona la candidatura per ateneo. Dati presi SOLO da pagine ufficiali (verifica 2026-10-18),
# tradotti/riassunti in italiano; ogni blocco ha la sua `source`.
# model: direct | doctoral_school | uk_admission | us_department
# deadlines: date = scadenza con anno (ISO) letta sulla pagina; recurring = "MM-DD" quando la pagina
#            indica solo giorno/mese ogni anno (l'app calcola la prossima occorrenza); note = testo libero.
# contacts: name/email null se non indicati sulla pagina.
# photo/photo_credit: foto campus per l'header della scheda ateneo; credit obbligatorio.

universities:
  - id: ETH
    photo: img/campus/eth.jpg
    photo_credit: null
    name: ETH Zürich
    city: Zurigo
    departments: [D-MAVT]
    model: direct
    rolling: true
    summary: >-
      Salvo eccezioni, i dottorandi ETH sono assunti come assistenti scientifici presso un professore:
      ci si candida a una posizione aperta, non a un bando unico. Il progetto si svolge in autonomia con
      il supporto del professore e termina con tesi ed esame orale (titolo Dr. sc. ETH Zurich).
    summary_source: https://ethz.ch/en/doctorate.html
    steps:
      - Cerca una posizione di dottorato sul portale lavoro ETH o sulla pagina del gruppo di ricerca
      - Candidati direttamente all'annuncio (assunzione come assistente scientifico)
      - Con l'assunzione, iscrizione al dottorato presso la Doctoral Administration (vedi guida al dottorato)
    steps_source: https://ethz.ch/en/doctorate.html
    prepare: []
    deadlines:
      - label: Ogni annuncio ha la propria scadenza
        date: null
        recurring: null
        source: https://jobs.ethz.ch/
    contacts:
      - role: Doctoral Administration (Academic Services)
        name: null
        email: doktorat@ethz.ch
        phone: "+41 44 632 26 72"
        url: https://ethz.ch/en/doctorate.html
        source: https://ethz.ch/en/doctorate.html
    verified: true

  - id: EPFL
    photo: img/campus/epfl.jpg
    photo_credit: null
    name: EPFL
    city: Losanna
    departments: [EDME (Mechanics)]
    model: doctoral_school
    rolling: false
    summary: >-
      Si fa domanda a un programma dottorale (per meccanica: EDME) entro le sue scadenze. Alcuni laboratori
      pubblicano posizioni su progetti specifici, ma per accedervi bisogna comunque essere ammessi al
      programma. L'iscrizione definitiva richiede tema di tesi, supervisore e finanziamento.
    summary_source: https://www.epfl.ch/education/admission/admission-2/phd-admission-criteria-and-application/
    steps:
      - Scegli il programma dottorale e controlla requisiti e procedure sulla sua pagina
      - Compila il modulo online (dati personali, percorso accademico, programma, contatti di 3 referenti)
      - Carica i PDF richiesti; i referenti ricevono l'invito e inviano le lettere online entro la scadenza
      - Una commissione valuta il dossier, tenendo conto anche del tema e dei supervisori indicati
      - Se ammesso, iscrizione alla scuola dottorale entro un anno (visti e permessi richiedono circa 3 mesi)
    steps_source: https://www.epfl.ch/education/admission/admission-2/phd-admission-criteria-and-application/
    prepare:
      - Diplomi e voti di tutti gli studi universitari (in inglese, francese, tedesco o italiano)
      - Statement of objectives
      - Copia del passaporto o documento d'identità
      - Contatti di 3 referenti (avvisali in anticipo)
    deadlines:
      - label: EDME — scadenza di primavera
        date: null
        recurring: "04-15"
        source: https://www.epfl.ch/education/admission/admission-2/phd-admission-criteria-and-application/application-deadlines/
      - label: EDME — scadenza d'inverno
        date: null
        recurring: "12-15"
        source: https://www.epfl.ch/education/admission/admission-2/phd-admission-criteria-and-application/application-deadlines/
    contacts:
      - role: Programma dottorale EDME
        name: null
        email: edme@epfl.ch
        url: https://www.epfl.ch/education/phd/edme-mechanics/
        source: https://www.epfl.ch/education/phd/edme-mechanics/
      - role: Direttore EDME
        name: Prof. Tobias Schneider
        email: null
        url: https://www.epfl.ch/education/phd/edme-mechanics/
        source: https://www.epfl.ch/education/phd/edme-mechanics/
      - role: Amministrazione EDME
        name: Martina Keddouh
        email: null
        url: https://www.epfl.ch/education/phd/edme-mechanics/
        source: https://www.epfl.ch/education/phd/edme-mechanics/
    verified: true

