  - id: Stanford
    photo: img/campus/stanford.jpg
    photo_credit: null
    name: Stanford University
    city: Stanford (CA)
    departments: [Aeronautics & Astronautics]
    model: us_department
    rolling: false
    summary: >-
      Un solo ciclo di ammissione al PhD all'anno, con scadenza definitiva. Il Master non è richiesto: chi
      punta al PhD con la sola laurea è incoraggiato a candidarsi direttamente al PhD.
    summary_source: https://aa.stanford.edu/academics-admissions/graduate-admissions/phd-admissions
    steps:
      - Domanda tramite la Stanford Graduate Admissions Application (tassa 125 $, possibile esenzione)
      - Carica statement of purpose, transcript e punteggi del test di inglese se richiesto
      - 3 lettere di referenza online (almeno una accademica; non tramite Interfolio)
      - La domanda completa deve arrivare entro la scadenza: dopo non viene accettata
    steps_source: https://aa.stanford.edu/academics-admissions/graduate-admissions/phd-admissions
    prepare:
      - Statement of purpose, massimo 2 pagine: obiettivi, visione di ricerca, docenti adatti come advisor
      - Transcript scansionati
      - 3 lettere di referenza
      - TOEFL iBT o IELTS Academic, se non rientri nei casi di esenzione
    deadlines:
      - label: PhD — autunno 2027-28 (domanda completa)
        date: "2026-12-01"
        recurring: null
        source: https://aa.stanford.edu/academics-admissions/graduate-admissions/phd-admissions
    contacts:
