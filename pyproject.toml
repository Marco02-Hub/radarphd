[project]
name = "radar-phd"
version = "0.1.0"
description = "Monitora posizioni di dottorato in ing. meccanica/aerospaziale in 10 atenei"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radar*"]
